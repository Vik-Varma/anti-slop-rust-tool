# Re-checks that every cited web page still says what the rules cite it for. Pages change, so this
# runs weekly rather than on every push.
name: Sources

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 study/check_sources.py
