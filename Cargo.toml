[package]
name = "anti-slop"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
toml = "1.1.8"
