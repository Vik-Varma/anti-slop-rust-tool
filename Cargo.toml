[package]
name = "anti-slop"
description = "Finds Rust code that is bad by an evidence-backed definition, not by taste"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Vik-Varma/anti-slop-rust-tool"
publish = false

[[bin]]
name = "anti-slop"
path = "src/main.rs"

[dependencies]
# Rust's own parser for proc macros: the full AST plus a visitor, so checks match syntax, not text.
syn = { version = "2", default-features = false, features = ["full", "visit", "parsing", "printing", "extra-traits"] }
# `span-locations` gives every node its line and column outside a proc macro.
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
